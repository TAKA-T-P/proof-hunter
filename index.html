<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>証明ハンター</title>
  <meta name="description" content="図形に隠された3つの根拠を探し出せ！ 中学数学の合同の証明を、図形をタップしながらゲーム感覚で練習できるWebアプリ。">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Cpolygon points='32,10 10,52 54,52' fill='none' stroke='%23fcd34d' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="title">
  <main id="app">

    <!-- タイトル画面 -->
    <section id="screen-title" class="screen screen-title" hidden>
      <!-- 左上：あそびかた（？）、右上：効果音ON/OFF（スピーカー） -->
      <button class="title-corner title-corner-left" data-go="#/howto" aria-label="あそびかた" title="あそびかた">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" class="ic-ring"/><path d="M9.2 9.3a2.9 2.9 0 1 1 4.1 2.6c-.9.4-1.3 1-1.3 1.9v.6" class="ic-line"/><circle cx="12" cy="17.4" r="1.25" class="ic-dot"/></svg>
      </button>
      <button class="title-corner title-corner-right" data-sound-toggle aria-pressed="true" aria-label="効果音 ON" title="効果音 ON"></button>
      <div class="title-box">
        <div class="title-emblem" aria-hidden="true">
          <svg viewBox="0 0 160 120">
            <polygon points="80,10 20,105 80,80" class="em-tri1"/>
            <polygon points="80,10 140,105 80,80" class="em-tri2"/>
            <line x1="80" y1="10" x2="80" y2="80" class="em-common"/>
            <circle cx="118" cy="38" r="20" class="em-lens"/>
            <line x1="132" y1="52" x2="150" y2="70" class="em-handle"/>
          </svg>
        </div>
        <h1 class="title-logo">証明ハンター</h1>
        <p class="title-sub">図形に隠された3つの根拠を探し出せ！</p>
        <div class="mode-cards">
          <button class="mode-card mode-hunter" data-go="#/select">
            <span class="mode-ico" aria-hidden="true">🔍</span>
            <span class="mode-text"><span class="mode-name">ハンターモード</span><span class="mode-desc">図をタップして、3つの根拠を探し出せ！</span></span>
          </button>
          <button class="mode-card mode-puzzle" data-go="#/puzzle">
            <span class="mode-ico" aria-hidden="true">🧩</span>
            <span class="mode-text"><span class="mode-name">証明パズルモード</span><span class="mode-desc">カードを組み合わせて、証明文を完成させよう！</span></span>
          </button>
          <button class="mode-card mode-rank" data-go="#/rank">
            <span class="mode-ico" aria-hidden="true">⏱️</span>
            <span class="mode-text">
              <span class="mode-name">段位認定モード</span>
              <span class="mode-desc">基本・総合の2コース！ 120秒で何問解ける？</span>
            </span>
          </button>
        </div>
        <div class="title-buttons">
          <button class="btn btn-gold btn-big" id="btn-continue" hidden>つづきから<span class="cont-sub"></span></button>
        </div>
      </div>
      <footer class="version">Ver.1.0</footer>
      <p class="copyright">©2026 T.TAKEMOTO / KEC Glows</p>
    </section>

    <!-- ステージ選択・ステージの問題一覧・苦手な問題（js/app.js が中身を作る） -->
    <section id="screen-select" class="screen screen-select" hidden>
      <header class="page-header">
        <button class="head-btn" id="select-back" data-go="#/" aria-label="戻る"><span class="ico">⌂</span><span class="lbl">ホーム</span></button>
        <h1 class="page-title" id="select-title">ステージをえらぶ</h1>
      </header>
      <div id="select-body"></div>
    </section>

    <!-- あそびかた -->
    <section id="screen-howto" class="screen screen-howto" hidden>
      <header class="page-header">
        <button class="head-btn" data-go="#/" aria-label="タイトルに戻る"><span class="ico">⌂</span><span class="lbl">ホーム</span></button>
        <h1 class="page-title">あそびかた</h1>
        <span></span>
      </header>
      <div class="card howto-card">
        <div class="howto-tabs" role="group" aria-label="モード">
          <button class="howto-tab" data-howto-tab="hunter" data-go="#/howto" aria-pressed="true">🔍 ハンター</button>
          <button class="howto-tab" data-howto-tab="puzzle" data-go="#/howto/puzzle" aria-pressed="false">🧩 証明パズル</button>
          <button class="howto-tab" data-howto-tab="rank" data-go="#/howto/rank" aria-pressed="false">⏱️ 段位認定</button>
        </div>
        <div class="howto-art" id="howto-art" aria-hidden="true"></div>
        <h2 class="howto-title" id="howto-title"></h2>
        <p class="howto-text" id="howto-text"></p>
        <div class="howto-dots" id="howto-dots" aria-hidden="true"></div>
        <div class="howto-nav">
          <button class="btn" id="howto-prev">◀ もどる</button>
          <button class="btn btn-primary" id="howto-next">つぎへ ▶</button>
        </div>
      </div>
    </section>

    <!-- 問題プレイ画面（js/play.js が中身を作る） -->
    <section id="screen-play" class="screen screen-play" hidden></section>

    <!-- 証明パズルのプレイ画面（js/puzzle-renderer.js が中身を作る） -->
    <section id="screen-puzzle" class="screen screen-play screen-puzzle" hidden></section>

    <!-- 段位認定（js/rank-renderer.js が中身を作る） -->
    <section id="screen-rank" class="screen screen-rank" hidden></section>
  </main>

  <!-- ヒント（図形を隠さない下部ポップアップ） -->
  <div id="hint-popup" class="hint-popup" role="status" aria-live="polite" hidden>
    <div class="hint-head">
      <span class="hint-level">ヒント</span>
      <button class="hint-close" id="hint-close" aria-label="ヒントを閉じる">×</button>
    </div>
    <p class="hint-text"></p>
    <p class="hint-count"></p>
  </div>

  <!-- 三角形を確認（証明する2つの三角形と、対応する頂点） -->
  <div id="tri-popup" class="hint-popup tri-popup" role="dialog" aria-label="三角形を確認" hidden>
    <div class="hint-head">
      <span class="hint-level">△ 証明する三角形</span>
      <button class="hint-close" id="tri-close" aria-label="閉じる">×</button>
    </div>
    <div class="tri-body"></div>
  </div>

  <!-- 証明成功・ステージクリアの演出（操作をさえぎらない） -->
  <div id="success-overlay" class="success-overlay" aria-hidden="true" hidden>
    <div class="success-burst"></div>
    <div class="success-text">証明成功！</div>
    <div class="success-concl"></div>
  </div>

  <script src="js/problems.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/right-triangle.js"></script>
  <script src="js/quadrilateral.js"></script>
  <script src="js/parallelogram-rules.js"></script>
  <script src="js/special-quadrilaterals.js"></script>
  <script src="js/angle-expression.js"></script>
  <script src="js/proof-rules.js"></script>
  <script src="js/proof-engine.js"></script>
  <script src="js/hints.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/chooser.js"></script>
  <script src="js/play.js"></script>
  <script src="js/math-keypad.js"></script>
  <script src="js/puzzle.js"></script>
  <script src="js/puzzle-renderer.js"></script>
  <script src="js/rank-config.js"></script>
  <script src="js/rank-tracks.js"></script>
  <script src="js/rank-questions.js"></script>
  <script src="js/rank-game.js"></script>
  <script src="js/rank-renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
